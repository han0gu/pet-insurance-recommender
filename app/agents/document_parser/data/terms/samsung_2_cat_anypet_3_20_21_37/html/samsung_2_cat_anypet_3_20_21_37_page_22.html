<h1 id="111" style="font-size:22px">비뇨기질환 확장보장 특별약관</h1>
<h1 id="112" style="font-size:16px">제1 조(보상하는 손해)</h1>
<p data-category="paragraph" id="113" style="font-size:14px">회사는 보통약관 제5조(보상하지 않는 손해) 제2항 제1호에도 불구하고, 비뇨기질환(요로결석 등)<br/>을 원인으로 하여 생긴 반려동물의 치료비를 보통약관 제4조(보상하는 손해)에 따라 보상하여 드<br/>립니다.</p>
<h1 id="114" style="font-size:20px">제2조(준용규정)</h1>
<p data-category="paragraph" id="115" style="font-size:14px">이 특별약관에 정하지 않은 사항은 보통약관을 따릅니다.</p>
