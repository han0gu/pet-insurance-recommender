<p data-category="paragraph" id="94" style="font-size:20px">회사는「보험료 및 해약환급금 산출방법서」에서 정한 이<br/>특별약관의 그 때까지 적립한 계약자적립액 및 미경과보험<br/>료를 지급합니다.</p>
<p data-category="paragraph" id="95" style="font-size:20px">제6조(준용규정)</p>
<p data-category="paragraph" id="96" style="font-size:16px">이 특별약관에서 정하지 않은 사항은「반려동물 비용손해<br/>관련 특별약관 일반조항」을 따르고,「반려동물 비용손해<br/>관련 특별약관 일반조항」에서 정하지 않은 사항은 보통약<br/>관을 따릅니다.</p>
