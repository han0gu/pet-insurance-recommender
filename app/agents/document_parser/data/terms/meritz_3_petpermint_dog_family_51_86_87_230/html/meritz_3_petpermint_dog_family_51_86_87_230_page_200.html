<h1 id="36" style="font-size:20px">용하지 않습니다.</h1>
<p data-category="list" id="37" style="font-size:16px">5. 가산이율 적용시 금융위원회 또는 금융감독원이<br/>정당한 사유로 인정하는 경우에는 해당 기간에<br/>대하여 가산이율을 적용하지 않습니다.<br/>6. 회사가 해지권을 행사하는 경우 위 표의 ‘청구<br/>일’은 보험사의 해지 의사표시(서면, 전자우<br/>편, 휴대전화 문자메시지 또는 이에 준하는 전<br/>자적 의사표시 포함)가 보험계약자 또는 그의<br/>대리인에게 도달한 날로 봅니다.</p>
