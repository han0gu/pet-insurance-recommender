<p data-category="paragraph" id="6" style="font-size:18px">는 보험계약의 부활(효력회복)을 승낙한 경우에 한하여 보<br/>통약관 제30조(보험료의 납입을 연체하여 해지된 계약의 부<br/>활(효력회복))를 준용합니다.</p>
<p data-category="paragraph" id="7" style="font-size:18px">제4조(준용규정)</p>
<p data-category="paragraph" id="8" style="font-size:18px">이 특별약관에 정하지 않은 사항은 보통약관 및 해당 특별<br/>약관을 따릅니다.</p>
