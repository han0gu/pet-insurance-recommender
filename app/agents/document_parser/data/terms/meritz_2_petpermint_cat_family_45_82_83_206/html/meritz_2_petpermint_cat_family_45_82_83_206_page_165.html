<p data-category="paragraph" id="78" style="font-size:18px">제7조(준용규정)</p>
<p data-category="paragraph" id="79" style="font-size:18px">이 특별약관에서 정하지 않은 사항은「반려동물 비용손해<br/>관련 특별약관 일반조항」을 따르고,「반려동물 비용손해<br/>관련 특별약관 일반조항」에서 정하지 않은 사항은 보통약<br/>관을 따릅니다.</p>
