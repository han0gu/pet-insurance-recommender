<h1 id="90" style="font-size:22px">치료비보상 제외 특별약관</h1>
<p data-category="paragraph" id="91" style="font-size:16px">제1 조(보험금을 지급하지 않는 사유)</p>
<p data-category="paragraph" id="92" style="font-size:14px">회사는 보통약관 제4조(보상하는 손해)에도 불구하고 상해 또는 질병 치료비로 인한 보험금은 이 특별<br/>약관에 따라 보상하지 않습니다.</p>
<h1 id="93" style="font-size:20px">제2조(준용규정)</h1>
<p data-category="paragraph" id="94" style="font-size:14px">이 특별약관에 정하지 않은 사항은 보통약관을 따릅니다.</p>
