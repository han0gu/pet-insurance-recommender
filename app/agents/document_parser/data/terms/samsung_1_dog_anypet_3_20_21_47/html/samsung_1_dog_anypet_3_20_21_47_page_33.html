<h1 id="0" style="font-size:22px">보험료 자동이체 특별약관</h1>
<h1 id="1" style="font-size:18px">제1 조(보험료납입)</h1>
<p data-category="paragraph" id="2" style="font-size:16px">계약자는 제2회 이후의 보험료부터 이 특별약관에 따라 계약자의 지정계좌를 이용하여 보험료를 자동<br/>납입 합니다.</p>
<h1 id="3" style="font-size:18px">제2조(보험료의 영수)</h1>
<p data-category="paragraph" id="4" style="font-size:16px">자동납입일자는 이 청약서에 기재된 보험료납입 해당일에도 불구하고 회사와 계약자가 별도로 약정한<br/>일자로 합니다.</p>
<h1 id="5" style="font-size:18px">제3조(계약 후 알릴 의무)</h1>
<p data-category="paragraph" id="6" style="font-size:16px">계약자는 지정계좌의 번호가 변경 또는 거래정지된 경우에는 그 사실을 즉시 회사에 알려야 합니다.</p>
<h1 id="7" style="font-size:20px">제4조(준용규정)</h1>
<p data-category="paragraph" id="8" style="font-size:16px">이 특별약관에 정하지 않은 사항은 보통약관을 따릅니다.</p>
