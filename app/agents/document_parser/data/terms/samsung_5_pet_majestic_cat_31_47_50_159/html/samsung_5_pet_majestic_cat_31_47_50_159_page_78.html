<h1 id="126" style="font-size:16px">회사는 아래의 사유를 원인으로 하여 생긴 손해는 보상하지 않습니다.</h1>
<p data-category="list" id="127" style="font-size:16px">1. 특별약관 일반사항 제7조(보험금을 지급하지 않는 사유)<br/>2. 위생관리, 미모를 위한 성형수술. 다만, 사고전 상태로의 회복을 위한 수술은 보상<br/>합니다.<br/>3. 선천적 기형 및 이에 근거한 병상</p>
<h1 id="128" style="font-size:20px">제5조 (특별약관의 소멸)</h1>
<p data-category="paragraph" id="129" style="font-size:16px">피보험자가 보험기간 중에 사망하였을 경우에는 "보험료 및 해약환급금 산출방법서"에서<br/>정하는 바에 따라 회사가 적립한 사망당시 이 특별약관의 계약자적립액 및 미경과보험료<br/>를 계약자에게 지급하고, 이 특별약관은 더 이상 효력이 없습니다.</p>
