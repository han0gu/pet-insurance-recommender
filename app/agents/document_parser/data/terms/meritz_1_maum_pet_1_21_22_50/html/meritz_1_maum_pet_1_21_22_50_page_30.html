<h1 id="114" style="font-size:14px">제20조(계약자의 임의해지)</h1>
<p data-category="paragraph" id="115" style="font-size:14px">계약자는 손해가 발생하기 전에는 언제든지 계약을 해지할 수 있습니다. 다만, 타인을 위<br/>한 계약의 경우에는 계약자는 그 타인의 동의를 얻거나 보험증권을 소지한 경우에 한하여<br/>계약을 해지할 수 있습니다.</p>
<h1 id="116" style="font-size:14px">제21조(준용규정)</h1>
<p data-category="paragraph" id="117" style="font-size:14px">이 특별약관에서 정하지 않은 사항은 보통약관을 따릅니다.</p>
