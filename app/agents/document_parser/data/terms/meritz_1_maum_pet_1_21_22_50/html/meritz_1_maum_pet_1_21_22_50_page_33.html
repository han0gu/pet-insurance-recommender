<h1 id="12" style="font-size:18px">반려동물 치료비 부보장 특별약관</h1>
<h1 id="13" style="font-size:14px">제1조(보험금을 지급하지 않는 사유)</h1>
<p data-category="paragraph" id="14" style="font-size:14px">회사는 보통약관 제4조(보험금의 지급사유) 에도 불구하고 이 특별약관에 따라 반려동물<br/>치료비 보험금을 보상하여 드리지 않습니다.</p>
<h1 id="15" style="font-size:14px">제2조(준용규정)</h1>
<p data-category="paragraph" id="16" style="font-size:14px">이 특별약관에 정하지 않은 사항은 보통약관을 따릅니다.</p>
